<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Smart Timetable</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗓️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--n:#0B1F3A;--n2:#17325C;--b:#2F5BEA;--bg:#F4F7FC;--l:#E1E8F4;--t:#1B2A41;--m:#6B7A92;--ok:#15803D;--er:#B91C1C;--wn:#B45309}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
#app{display:contents}
aside{width:236px;background:var(--n);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-weight:700;font-size:17px;padding:0 10px 18px;line-height:1.3}.logo small{display:block;font-weight:400;color:#9FB3D6;font-size:12px}
.nv{background:none;border:0;color:#C9D6EE;text-align:left;padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer}
.nv:hover{background:var(--n2)}.nv.on{background:#fff;color:var(--n);font-weight:700}
.sp{flex:1}.cl{background:var(--n2);border:0;color:#fff;border-radius:10px;padding:10px 12px;font:inherit;font-size:12px;text-align:left;cursor:pointer}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#94A3B8;margin-right:6px}.dot.on{background:#4ADE80}.dot.err{background:#F87171}
main{flex:1;padding:30px 34px;max-width:1180px;min-width:0}
h1{margin:0 0 4px;font-size:26px;color:var(--n)}h2{margin:0 0 12px;font-size:16px;color:var(--n)}.sub{margin:0 0 22px;color:var(--m)}
.card{background:#fff;border:1px solid var(--l);border-radius:14px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{margin:0;display:flex;flex-direction:column}.st span{color:var(--m);font-size:13px}.st b{font-size:28px;color:var(--n)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--l);background:#fff;color:var(--n);padding:9px 16px;border-radius:10px;font:inherit;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--n)}.btn.p{background:var(--n);color:#fff;border-color:var(--n)}.btn.p:hover{background:var(--n2)}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.msg{padding:12px 14px;border-radius:10px;margin-top:12px;background:#EEF2FA}.msg ul{margin:6px 0 0;padding-left:20px}
.msg.ok{background:#ECFDF3;color:var(--ok)}.msg.er{background:#FEF2F2;color:var(--er)}.msg.wn{background:#FFFBEB;color:var(--wn)}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--t);width:100%}
.row select{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chip{border:1px solid var(--l);background:#fff;border-radius:99px;padding:6px 16px;font:inherit;cursor:pointer;color:var(--n)}.chip.on{background:var(--n);color:#fff}
.sc{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%}th{text-align:left;font-weight:500;color:var(--m);font-size:13px;padding:6px 4px}td{padding:3px 4px}
.x{border:0;background:none;color:var(--er);cursor:pointer;font-size:16px;padding:6px 10px}
.chk{list-style:none;padding:0;margin:12px 0 0}.chk li{padding:4px 0;border-bottom:1px solid var(--l)}.chk li:last-child{border:0}
.g{width:100%;border-collapse:separate;border-spacing:6px;min-width:760px}.g th{text-align:center;color:var(--n);font-weight:700}
.g td{vertical-align:top;background:#F8FAFD;border-radius:10px;height:96px;padding:5px;width:16%}.g td.h{background:none;width:12%;text-align:center;font-size:12px;color:var(--m)}
.lunch td{height:auto;background:none;text-align:center;color:var(--m);font-size:12px;padding:0}
.cc{border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.4;margin-bottom:4px;border-left:4px solid var(--b);background:#E8EEFC;color:var(--n)}
.cc b{display:block;font-size:13px}.cc small{color:#46587A}
.c1{background:#E3F1F7;border-color:#0E7490}.c2{background:#EAE9F8;border-color:#5B4FCF}.c3{background:#E5F3EE;border-color:#0F766E}.c4{background:#EEF0F4;border-color:#334155}
.empty{text-align:center;color:var(--m);padding:40px}
dialog{border:0;border-radius:14px;padding:24px;width:min(460px,92vw)}dialog::backdrop{background:#0B1F3A99}dialog label{display:block;margin:10px 0;color:var(--m)}
#toast{position:fixed;bottom:22px;right:22px;background:var(--n);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
@media(max-width:820px){body{flex-direction:column}aside{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.logo{padding:0 10px 0 0}.sp{display:none}main{padding:20px 16px}}
@media print{aside,.noprint{display:none!important}main{padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body>
<div id="app"></div>
<dialog id="dlg"><h2>เชื่อมต่อฐานข้อมูลคลาวด์ (Supabase)</h2>
<label>Project URL<input id="cu" placeholder="https://xxxx.supabase.co"></label>
<label>Anon public key<input id="ck" placeholder="eyJ..."></label>
<div class="row"><button class="btn p" onclick="saveCfg()">บันทึกและเชื่อมต่อ</button><button class="btn" onclick="cloudSave(true)">บันทึกขึ้นคลาวด์ตอนนี้</button><button class="btn" onclick="dlg.close()">ปิด</button></div></dialog>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
/*ENGINE*/
const DK=['จ','อ','พ','พฤ','ศ'],DN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'],EN={mon:0,tue:1,wed:2,thu:3,fri:4};
const ENT={
 teachers:{l:'ครู',f:[['id','รหัสครู'],['name','ชื่อ'],['skills','วิชาที่สอนได้',,1],['unavail','ไม่สะดวก เช่น จ:P1, พฤ',,1],['max','สูงสุด/วัน','number']]},
 rooms:{l:'ห้อง',f:[['id','รหัสห้อง'],['type','ประเภทห้อง'],['cap','ความจุ','number']]},
 groups:{l:'กลุ่มเรียน',f:[['id','กลุ่ม'],['size','จำนวนนักศึกษา','number']]},
 courses:{l:'รายวิชา',f:[['id','รหัสวิชา'],['name','รายวิชา'],['teacher','รหัสครู'],['group','กลุ่ม'],['n','คาบ/สัปดาห์','number'],['room','ห้อง/ประเภทห้อง']]},
 periods:{l:'คาบ',f:[['id','รหัสคาบ'],['start','เริ่ม'],['end','สิ้นสุด']]}};
const DEF=()=>({
 periods:[['P1','08:30','10:30'],['P2','10:30','12:30'],['P3','13:30','15:30'],['P4','15:30','17:30']].map(([id,start,end])=>({id,start,end})),
 teachers:[['T01','ครูสมชาย','AI, Python','จ:P1'],['T02','ครูสมหญิง','Database, SQL','พ:P3'],['T03','ครูสมศักดิ์','Network, Cybersecurity','ศ:P4'],['T04','ครูสมพร','Web Programming','อ:P2']].map(([id,name,skills,unavail])=>({id,name,skills,unavail,max:3})),
 rooms:[['R101','ห้องเรียนทั่วไป',35],['R102','ห้องเรียนทั่วไป',30],['LAB-AI','ห้องปฏิบัติการ AI',25],['LAB-NET','ห้องปฏิบัติการเครือข่าย',25]].map(([id,type,cap])=>({id,type,cap})),
 groups:[{id:'A',size:25},{id:'B',size:25}],
 courses:[['AI201','พื้นฐานปัญญาประดิษฐ์','T01','A','LAB-AI'],['PY202','การเขียนโปรแกรม Python','T01','A','LAB-AI'],['DB203','ระบบฐานข้อมูล','T02','A','R101'],['SQL204','การเขียน SQL','T02','B','R102'],['NT205','ระบบเครือข่าย','T03','B','LAB-NET'],['CY206','ความปลอดภัยไซเบอร์','T03','A','LAB-NET'],['WB207','การพัฒนาเว็บ','T04','B','R101'],['WB208','โครงงานเว็บแอปพลิเคชัน','T04','A','LAB-AI']].map(([id,name,teacher,group,room])=>({id,name,teacher,group,n:2,room}))});
const dayIdx=s=>{s=s.trim().toLowerCase();const i=DK.indexOf(s);return i>=0?i:(EN[s.slice(0,3)]??-1)};
function unSet(t,P){const s=new Set(),bad=[],ids=P.map(x=>String(x.id).trim());String(t.unavail||'').split(/[,;，]/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{const [d,p]=tok.split(':'),di=dayIdx(d),pp=(p||'').trim().toUpperCase();if(di<0||(pp&&!ids.includes(pp))){bad.push(tok);return}(pp?[pp]:ids).forEach(x=>s.add(di+'|'+x))});return{s,bad}}
function validate(D){const E=[],str=v=>String(v??'').trim();
 Object.keys(ENT).forEach(k=>{const e=ENT[k],seen=new Set();if(!D[k].length)E.push(`ไม่มีข้อมูล${e.l}`);
  D[k].forEach((r,i)=>{e.f.forEach(([f,l,t,o])=>{const v=str(r[f]);if(!v&&!o)E.push(`${e.l} แถว ${i+1}: ไม่ได้กรอก "${l}"`);else if(t==='number'&&v&&!(+v>0))E.push(`${e.l} แถว ${i+1}: "${l}" ต้องเป็นตัวเลขมากกว่า 0`)});
   const id=str(r.id);if(id){if(seen.has(id))E.push(`${e.l}: รหัส "${id}" ซ้ำ`);seen.add(id)}})});
 const has=(k,v)=>D[k].some(x=>str(x.id)===str(v));
 D.teachers.forEach(t=>unSet(t,D.periods).bad.forEach(b=>E.push(`ครู ${t.id}: รูปแบบเวลาไม่สะดวก "${b}" ไม่ถูกต้อง (ตัวอย่าง จ:P1 หรือ พฤ)`)));
 D.courses.forEach(c=>{const L='วิชา '+c.id,g=D.groups.find(x=>str(x.id)===str(c.group));
  if(str(c.teacher)&&!has('teachers',c.teacher))E.push(`${L}: ไม่พบครู "${c.teacher}"`);
  if(str(c.group)&&!g)E.push(`${L}: ไม่พบกลุ่ม "${c.group}"`);
  if(!Number.isInteger(+c.n)&&str(c.n))E.push(`${L}: จำนวนคาบต้องเป็นจำนวนเต็ม`);
  if(+c.n>5*D.periods.length)E.push(`${L}: จำนวนคาบเกินคาบทั้งสัปดาห์`);
  const rs=D.rooms.filter(r=>str(r.id)===str(c.room)||str(r.type)===str(c.room));
  if(str(c.room)&&!rs.length)E.push(`${L}: ไม่พบห้องหรือประเภทห้อง "${c.room}"`);
  else if(rs.length&&g&&!rs.some(r=>+r.cap>=+g.size))E.push(`${L}: ห้องที่กำหนดจุไม่พอสำหรับกลุ่ม ${g.id} (${g.size} คน)`)});
 return{E}}
function solve(D,limit=300000){
 const P=D.periods.map(p=>p.id),NP=P.length,k=(...a)=>a.join('|'),T={},G={};
 D.teachers.forEach(t=>T[t.id]={u:unSet(t,D.periods).s,max:+t.max||3});D.groups.forEach(g=>G[g.id]=+g.size||0);
 const units=[];D.courses.forEach(c=>{const rooms=D.rooms.filter(r=>(r.id===c.room||r.type===c.room)&&+r.cap>=G[c.group]);for(let j=0;j<+c.n;j++)units.push({c,k:j,rooms,i:units.length,done:false,slot:-1})});
 const tU={},rU={},gU={},tD={},gD={},cD={},asg=[];let nodes=0,best=[];
 const opts=u=>{const c=u.c,t=T[c.teacher],o=[],pv=u.k?units[u.i-1].slot:-1;
  for(let d=0;d<5;d++)for(let pi=0;pi<NP;pi++){const p=P[pi];if(d*NP+pi<=pv||t.u.has(k(d,p))||tU[k(c.teacher,d,p)]||gU[k(c.group,d,p)]||(tD[k(c.teacher,d)]||0)>=t.max)continue;
   for(const r of u.rooms)if(!rU[k(r.id,d,p)])o.push([d,p,r,(cD[k(c.id,d)]?100:0)+(gD[k(c.group,d)]||0)*4+(tD[k(c.teacher,d)]||0)*2,pi])}
  return o.sort((a,b)=>a[3]-b[3])};
 const mark=(u,d,p,r,v)=>{const c=u.c;tU[k(c.teacher,d,p)]=rU[k(r.id,d,p)]=gU[k(c.group,d,p)]=v>0;[[tD,k(c.teacher,d)],[gD,k(c.group,d)],[cD,k(c.id,d)]].forEach(([m,x])=>m[x]=(m[x]||0)+v)};
 function rec(){if(nodes++>limit)return false;let bu=null,bo=null;
  for(const u of units){if(u.done||(u.k&&!units[u.i-1].done))continue;const o=opts(u);if(!o.length){if(asg.length>best.length)best=asg.slice();return false}if(!bo||o.length<bo.length){bu=u;bo=o}}
  if(!bu)return true;
  for(const [d,p,r,,pi] of bo){mark(bu,d,p,r,1);bu.done=true;bu.slot=d*NP+pi;asg.push({u:bu,d,p,r});if(rec())return true;asg.pop();bu.done=false;bu.slot=-1;mark(bu,d,p,r,-1)}
  return false}
 const dead=units.filter(u=>!opts(u).length);dead.forEach(u=>u.done=true);
 const r0=rec(),ok=r0&&!dead.length,raw=r0?asg.slice():best;
 return{ok,raw,nodes,limited:nodes>limit,tt:raw.map(a=>({course:a.u.c.id,teacher:a.u.c.teacher,group:a.u.c.group,room:a.r.id,day:a.d,period:a.p}))}}
function diag(D,raw){const done={},tot=5*D.periods.length,out=[];raw.forEach(a=>done[a.u.c.id]=(done[a.u.c.id]||0)+1);
 D.courses.forEach(c=>{const miss=+c.n-(done[c.id]||0);if(miss<=0)return;const t=D.teachers.find(x=>x.id===c.teacher),why=[],tip=[],sum=f=>D.courses.filter(f).reduce((s,x)=>s+ +x.n,0);
  const cap=Math.min(tot-unSet(t,D.periods).s.size,(+t.max||3)*5),dem=sum(x=>x.teacher===c.teacher);
  if(dem>cap){why.push(`ครู ${t.name} ต้องสอน ${dem} คาบ แต่สอนได้สูงสุด ${cap} คาบ/สัปดาห์`);tip.push('ย้ายบางวิชาให้ครูท่านอื่น ลดจำนวนคาบ หรือผ่อนคลายข้อจำกัดของครู')}
  const rs=D.rooms.filter(r=>r.id===c.room||r.type===c.room),rd=sum(x=>x.room===c.room);
  if(rd>rs.length*tot){why.push(`ห้อง "${c.room}" มีความต้องการ ${rd} คาบ แต่มีคาบว่างรวม ${rs.length*tot}`);tip.push('เพิ่มห้องประเภทเดียวกัน')}
  const gd=sum(x=>x.group===c.group);if(gd>tot){why.push(`กลุ่ม ${c.group} ต้องเรียน ${gd} คาบ เกินคาบทั้งสัปดาห์ (${tot})`);tip.push('ลดจำนวนคาบหรือเพิ่มคาบ/วันเรียน')}
  if(!why.length){why.push('ไม่มีช่วงเวลาที่ครู ห้อง และกลุ่มนักศึกษาว่างตรงกันครบเมื่อรวมทุกวิชา');tip.push('เปิดวันที่ครูสอนได้เพิ่ม เพิ่มห้อง หรือเพิ่มคาบเรียนต่อวัน')}
  out.push({id:c.id,name:c.name,miss,why,tip})});return out}
function check(D,tt){const R=[['ครูไม่สอนซ้อนเวลา'],['ห้องไม่ถูกใช้ซ้อนเวลา'],['กลุ่มนักศึกษาไม่เรียนซ้อนเวลา'],['ไม่ชนช่วงที่ครูไม่สะดวก'],['ใช้ห้องตรงประเภท/ความจุที่กำหนด'],['ไม่เกินภาระสอนสูงสุดต่อวัน'],['จัดครบทุกวิชาตามจำนวนคาบ']].map(([l])=>({l,bad:[]}));
 const cnt={},c=(x)=>(cnt[x]=(cnt[x]||0)+1),cm={},un={},tm={},rm={},gm={};
 D.courses.forEach(x=>cm[x.id]=x);D.teachers.forEach(t=>{un[t.id]=unSet(t,D.periods).s;tm[t.id]=t});D.rooms.forEach(r=>rm[r.id]=r);D.groups.forEach(g=>gm[g.id]=g);
 tt.forEach(a=>{const w=`${DN[a.day]} ${a.period}`,x=cm[a.course];
  if(c('t|'+a.teacher+w)==2)R[0].bad.push(`${a.teacher} ซ้อน ${w}`);
  if(c('r|'+a.room+w)==2)R[1].bad.push(`${a.room} ซ้อน ${w}`);
  if(c('g|'+a.group+w)==2)R[2].bad.push(`กลุ่ม ${a.group} ซ้อน ${w}`);
  if(un[a.teacher].has(a.day+'|'+a.period))R[3].bad.push(`${a.teacher} ไม่สะดวก ${w}`);
  const r=rm[a.room];if(!(r.id===x.room||r.type===x.room)||+r.cap<+gm[a.group].size)R[4].bad.push(`${a.course} อยู่ห้อง ${a.room} ไม่ถูกต้อง`);
  if(c('d|'+a.teacher+a.day)==(+tm[a.teacher].max||3)+1)R[5].bad.push(`${a.teacher} เกินสูงสุด/วัน ใน${DN[a.day]}`)});
 D.courses.forEach(x=>{const n=tt.filter(a=>a.course===x.id).length;if(n!==+x.n)R[6].bad.push(`${x.id} จัดได้ ${n}/${x.n} คาบ`)});return R}
/*END*/

/* ---------- UI ---------- */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=load(),page='home',tab='teachers',view={by:'group',id:''},cs={s:'off'},sb=null,timer;
function load(){try{const s=JSON.parse(localStorage.getItem('ast_v1'));if(s&&s.data&&s.data.courses)return s}catch(e){}return{data:DEF(),tt:null,res:null,stale:false}}
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2800)}
function persist(){try{localStorage.setItem('ast_v1',JSON.stringify(S))}catch(e){}clearTimeout(timer);if(sb)timer=setTimeout(()=>cloudSave(),900)}
const cfg=()=>{const c=window.APP_CONFIG||{};let l={};try{l=JSON.parse(localStorage.getItem('ast_cfg')||'{}')}catch(e){}return{url:l.url||c.SUPABASE_URL,key:l.key||c.SUPABASE_ANON_KEY}};
async function cloudInit(){const c=cfg();if(!c.url||!c.key||!window.supabase){cs={s:'off'};return}
 try{sb=window.supabase.createClient(c.url,c.key);const{data,error}=await sb.from('timetable_state').select('data').eq('id','default').maybeSingle();if(error)throw error;
  if(data&&data.data&&data.data.data&&data.data.data.courses)S=data.data;else await cloudSave();cs={s:'on'}}catch(e){sb=null;cs={s:'err',m:e.message}}}
async function cloudSave(manual){if(!sb){if(manual)toast('ยังไม่ได้เชื่อมต่อคลาวด์');return}
 const{error}=await sb.from('timetable_state').upsert({id:'default',data:S,updated_at:new Date().toISOString()});
 if(error){cs={s:'err',m:error.message};toast('บันทึกคลาวด์ไม่สำเร็จ: '+error.message)}else{cs={s:'on'};if(manual)toast('บันทึกขึ้นคลาวด์แล้ว')}render()}
function openCfg(){const c=cfg();$('#cu').value=c.url||'';$('#ck').value=c.key||'';dlg.showModal()}
async function saveCfg(){localStorage.setItem('ast_cfg',JSON.stringify({url:$('#cu').value.trim(),key:$('#ck').value.trim()}));dlg.close();await cloudInit();render();toast(cs.s==='on'?'เชื่อมต่อคลาวด์สำเร็จ':'เชื่อมต่อไม่สำเร็จ '+(cs.m||''))}
function run(){const v=validate(S.data);if(v.E.length){S.res={st:'invalid'};S.tt=null;persist();toast(`พบข้อมูลไม่ถูกต้อง ${v.E.length} รายการ`);render();return}
 const r=solve(S.data),ck=check(S.data,r.tt);S.tt=r.tt;S.stale=false;S.res=r.ok?{st:'ok',ck,n:r.tt.length}:{st:'fail',ck,d:diag(S.data,r.raw),lim:r.limited,n:r.tt.length};
 persist();render();toast(r.ok?'จัดตารางสำเร็จ':'จัดตารางไม่ครบ ดูสาเหตุด้านล่าง')}
function block(){const t=$('#bt').value,d=+$('#bd').value,x=S.data.teachers.find(a=>a.id===t);if(!x)return;
 if(!unSet(x,S.data.periods).s.size||![...Array(S.data.periods.length)].every((_,i)=>unSet(x,S.data.periods).s.has(d+'|'+S.data.periods[i].id)))x.unavail=(x.unavail?x.unavail+', ':'')+DK[d];
 run();toast(`${x.name} ไม่สะดวก${DN[d]} และจัดตารางใหม่แล้ว`)}
function edit(i,f,v){const t=ENT[tab].f.find(x=>x[0]===f)[2];S.data[tab][i][f]=t==='number'?(v===''?'':+v):v.trim();S.stale=true;persist()}
function del(i){S.data[tab].splice(i,1);S.stale=true;persist();render()}
function add(){const o={};ENT[tab].f.forEach(([f,,t])=>o[f]=t==='number'?'':'');S.data[tab].push(o);S.stale=true;persist();render()}
function reset(){if(confirm('รีเซ็ตเป็นข้อมูลตัวอย่าง? ข้อมูลปัจจุบันจะถูกแทนที่'))S={data:DEF(),tt:null,res:null,stale:false},persist(),render()}
function imp(f){if(!f)return;if(!window.XLSX)return toast('โหลดไลบรารี Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');const r=new FileReader();
 r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',codepage:65001});let n=0;
  wb.SheetNames.forEach(sn=>{const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});if(!rows.length)return;const hd=Object.keys(rows[0]).map(h=>h.trim().toLowerCase());
   const k=Object.keys(ENT).find(x=>sn.trim().toLowerCase()===x)||(hd.includes('teacher')?'courses':hd.includes('skills')?'teachers':hd.includes('cap')?'rooms':hd.includes('size')?'groups':hd.includes('start')?'periods':null);if(!k)return;
   S.data[k]=rows.map(r0=>{const lo={},o={};Object.keys(r0).forEach(h=>lo[h.trim().toLowerCase()]=r0[h]);ENT[k].f.forEach(([x,,t])=>{const v=lo[x];o[x]=t==='number'?(v===''||v==null?'':+v):String(v??'').trim()});return o});n++});
  if(!n)return toast('ไม่พบตารางข้อมูลที่รู้จักในไฟล์ (ดูรูปแบบใน README.md)');
  S.stale=true;S.tt=null;S.res=null;persist();render();toast(`นำเข้าข้อมูล ${n} ตารางแล้ว`)}catch(err){toast('อ่านไฟล์ไม่ได้: '+err.message)}};r.readAsArrayBuffer(f)}
function expX(){if(!window.XLSX)return toast('โหลดไลบรารี Excel ไม่สำเร็จ');const wb=XLSX.utils.book_new();Object.keys(ENT).forEach(k=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.data[k]),k));XLSX.writeFile(wb,'timetable-data.xlsx')}
function expC(){if(!S.tt)return toast('ยังไม่มีตาราง');const cm={},P={};S.data.courses.forEach(c=>cm[c.id]=c);S.data.periods.forEach(p=>P[p.id]=p);
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['รหัสวิชา','รายวิชา','ครู','กลุ่ม','ห้อง','วัน','เวลา']].concat([...S.tt].sort((a,b)=>a.day-b.day||a.period.localeCompare(b.period)).map(a=>[a.course,cm[a.course].name,a.teacher,a.group,a.room,DN[a.day],P[a.period].start+'-'+P[a.period].end]));
 const u=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='timetable.csv';a.click();URL.revokeObjectURL(u)}

function home(){const D=S.data,v=validate(D),R=S.res,tot=D.courses.reduce((s,c)=>s+(+c.n||0),0);
 const ckh=ck=>`<ul class="chk">${ck.map(x=>`<li>${x.bad.length?'❌':'✅'} ${x.l}${x.bad.length?`<br><small>${x.bad.map(esc).join(', ')}</small>`:''}</li>`).join('')}</ul>`;
 let res='<div class="msg">ยังไม่ได้จัดตาราง กดปุ่ม "จัดตารางอัตโนมัติ" ด้านบน</div>';
 if(R&&R.st==='invalid')res='<div class="msg er">ไม่สามารถจัดตารางได้ เนื่องจากข้อมูลไม่ถูกต้อง โปรดแก้ไขตามรายการในขั้นตอนที่ 1</div>';
 if(R&&R.st==='ok')res=`<div class="msg ok"><b>จัดตารางสำเร็จครบ ${R.n} คาบ</b> ผ่านการตรวจสอบเงื่อนไขทุกข้อ</div>${ckh(R.ck)}<div class="row noprint" style="margin-top:12px"><button class="btn p" onclick="page='tt';render()">ดูตารางเรียน/สอน</button></div>`;
 if(R&&R.st==='fail')res=`<div class="msg er"><b>จัดตารางไม่ครบ (จัดได้ ${R.n} คาบ)</b> ระบบไม่สร้างตารางที่ผิดเงื่อนไข ตารางที่แสดงเป็นเพียงส่วนที่จัดได้${R.lim?' (การค้นหาถึงขีดจำกัดเวลา)':''}<ul>${R.d.map(x=>`<li><b>${esc(x.id)} ${esc(x.name)}</b> ขาด ${x.miss} คาบ — สาเหตุ: ${x.why.map(esc).join('; ')}<br>แนวทางแก้ไข: ${x.tip.map(esc).join('; ')}</li>`).join('')}</ul></div>${ckh(R.ck)}`;
 return `<h1>AI Smart Timetable</h1><p class="sub">จัดตารางเรียนและตารางสอนอัตโนมัติ พร้อมตรวจการชนกันของครู ห้องเรียน และกลุ่มนักศึกษา</p>
 <div class="stats">${[['ครู',D.teachers.length],['ห้องเรียน',D.rooms.length],['รายวิชา',D.courses.length],['คาบ/สัปดาห์',tot]].map(([a,b])=>`<div class="card st"><span>${a}</span><b>${b}</b></div>`).join('')}</div>
 <div class="card noprint"><h2>เริ่มใช้งาน</h2><div class="row"><button class="btn p" onclick="run()">⚡ จัดตารางอัตโนมัติ</button><label class="btn">📂 นำเข้า Excel / CSV<input type="file" hidden accept=".xlsx,.xls,.csv" onchange="imp(this.files[0]);this.value=''"></label><button class="btn" onclick="expX()">⬇ ส่งออกข้อมูล (.xlsx)</button><button class="btn" onclick="expC()">⬇ ส่งออกตาราง (.csv)</button><button class="btn" onclick="reset()">↺ ใช้ข้อมูลตัวอย่าง</button></div>${S.stale&&S.tt?'<div class="msg wn">ข้อมูลเปลี่ยนไปหลังจัดตารางล่าสุด กรุณากดจัดตารางใหม่</div>':''}</div>
 <div class="card"><h2>ขั้นตอนที่ 1: ตรวจสอบข้อมูล</h2>${v.E.length?`<div class="msg er"><b>พบข้อผิดพลาด ${v.E.length} รายการ</b><ul>${v.E.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="msg ok">✓ ข้อมูลครบถ้วน ไม่พบข้อมูลซ้ำหรือข้อมูลที่ขาดหาย</div>'}</div>
 <div class="card noprint"><h2>เปลี่ยนเงื่อนไขแล้วจัดใหม่</h2><div class="row"><select id="bt">${D.teachers.map(t=>`<option value="${esc(t.id)}">${esc(t.id)} ${esc(t.name)}</option>`).join('')}</select><span>ไม่สะดวกสอนวัน</span><select id="bd">${DN.map((d,i)=>`<option value="${i}" ${i==3?'selected':''}>${d}</option>`).join('')}</select><button class="btn p" onclick="block()">เพิ่มเงื่อนไขและจัดตารางใหม่</button></div></div>
 <div class="card"><h2>ขั้นตอนที่ 2: ผลการจัดตาราง</h2>${res}</div>`}
function data(){const e=ENT[tab],rows=S.data[tab];
 return `<h1>จัดการข้อมูล</h1><p class="sub">แก้ไขได้ทันที ระบบบันทึกอัตโนมัติ เมื่อแก้เสร็จให้กลับไปกดจัดตารางใหม่</p><div class="chips">${Object.keys(ENT).map(k=>`<button class="chip ${k==tab?'on':''}" onclick="tab='${k}';render()">${ENT[k].l} (${S.data[k].length})</button>`).join('')}</div>
 <div class="card"><div class="sc"><table><thead><tr>${e.f.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r,i)=>`<tr>${e.f.map(f=>`<td><input type="${f[2]||'text'}" ${f[2]?'min="1"':''} value="${esc(r[f[0]])}" oninput="edit(${i},'${f[0]}',this.value)"></td>`).join('')}<td><button class="x" title="ลบแถว" onclick="del(${i})">✕</button></td></tr>`).join('')}</tbody></table></div><button class="btn" onclick="add()">+ เพิ่มแถว</button>
 ${tab==='teachers'?'<div class="msg">ช่อง "ไม่สะดวก": พิมพ์วันตามด้วยคาบ เช่น <b>จ:P1</b> (จันทร์คาบ 1) หรือพิมพ์เฉพาะวัน เช่น <b>พฤ</b> (ทั้งวัน) คั่นหลายรายการด้วยจุลภาค วัน: จ อ พ พฤ ศ</div>':''}</div>`}
function ttv(){const D=S.data,R=S.res;if(!S.tt)return `<h1>ตารางเรียน/สอน</h1><div class="card empty">ยังไม่มีตาราง<br>ไปที่หน้าภาพรวมแล้วกด "จัดตารางอัตโนมัติ"</div>`;
 const src={group:D.groups,teacher:D.teachers,room:D.rooms}[view.by];if(!src.some(x=>x.id==view.id))view.id=src[0]?src[0].id:'';
 const cm={},tn={};D.courses.forEach(c=>cm[c.id]=c);D.teachers.forEach(t=>tn[t.id]=t.name);
 const sel=S.tt.filter(a=>(view.by=='group'?a.group:view.by=='teacher'?a.teacher:a.room)==view.id),hs=s=>[...s].reduce((h,c)=>h+c.charCodeAt(0),0)%5;
 let body='';D.periods.forEach((p,i)=>{body+=`<tr><td class="h"><b>${esc(p.id)}</b><br>${esc(p.start)}–${esc(p.end)}</td>${DN.map((_,d)=>`<td>${sel.filter(a=>a.day==d&&a.period==p.id).map(a=>{const c=cm[a.course];return `<div class="cc c${hs(a.course)}"><b>${esc(c.id)} ${esc(c.name)}</b><small>${[view.by!='teacher'?tn[a.teacher]:'',view.by!='group'?'กลุ่ม '+a.group:'',view.by!='room'?a.room:''].filter(Boolean).map(esc).join(' · ')}</small></div>`}).join('')}</td>`).join('')}</tr>`;
  const n=D.periods[i+1];if(n&&n.start>p.end)body+='<tr class="lunch"><td colspan="6">พักกลางวัน</td></tr>'});
 return `<h1>ตารางเรียน/สอน</h1><p class="sub">${R&&R.st==='fail'?'⚠ แสดงเฉพาะส่วนที่จัดได้ (ยังไม่ครบทุกวิชา)':'เลือกดูตามกลุ่มนักศึกษา ครู หรือห้อง'}</p>
 <div class="row noprint" style="margin-bottom:14px"><select onchange="view.by=this.value;view.id='';render()">${[['group','กลุ่มนักศึกษา'],['teacher','ครู'],['room','ห้อง']].map(([v,l])=>`<option value="${v}" ${v==view.by?'selected':''}>${l}</option>`).join('')}</select><select onchange="view.id=this.value;render()">${src.map(x=>`<option value="${esc(x.id)}" ${x.id==view.id?'selected':''}>${esc(x.id)}${x.name?' '+esc(x.name):''}</option>`).join('')}</select><button class="btn" onclick="expC()">⬇ CSV</button><button class="btn" onclick="print()">🖨 พิมพ์</button></div>
 <div class="card"><div class="sc"><table class="g"><thead><tr><th></th>${DN.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div></div>`}
function render(){const st={on:'เชื่อมต่อคลาวด์แล้ว',err:'คลาวด์ผิดพลาด (กดดูการตั้งค่า)',off:'ออฟไลน์ (บันทึกในเครื่อง)'}[cs.s];
 $('#app').innerHTML=`<aside><div class="logo">AI Smart Timetable<small>ระบบจัดตารางเรียน-สอน</small></div>${[['home','ภาพรวมและจัดตาราง'],['data','จัดการข้อมูล'],['tt','ตารางเรียน/สอน']].map(([k,l])=>`<button class="nv ${page==k?'on':''}" onclick="page='${k}';render()">${l}</button>`).join('')}<div class="sp"></div><button class="cl" onclick="openCfg()"><span class="dot ${cs.s}"></span>${st}</button></aside><main>${page=='home'?home():page=='data'?data():ttv()}</main>`}
render();cloudInit().then(render);
</script></body></html>
